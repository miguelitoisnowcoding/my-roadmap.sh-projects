<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Clock</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main>
    <section class="pomodoro-container">
      <div class="pomodoro-container__header">
        <h1>Pomodoro Clock</h1>
      </div>
      <div class="pomodoro-container__body">
        <p class="pomodoro-body__display" id="display">00:00</p>
      </div>
      <div class="pomodoro-container__footer">
        <button class="pomodoro-footer__buttons" id="startBtn">Start</button>
      </div>
    </section>
  </main>
  <script src="scripts/index.js"></script>
</body>
</html>
