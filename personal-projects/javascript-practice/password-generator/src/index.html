<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <h1>Password Generator</h1>
  </header>
  <main>
    <section class="password-container">
      <div class="password-container__length">
        <label for="">Password Length: </label>
        <input type="range" min="5" max="50" value="5" name="" id="passwordLengthRange">
        <p id="passwordLengthRange__value"></p>
      </div>
      <div class="password-container__radio">
        <label for="">What do you want to include?</label>
        <label for="">Lowercase</label>
        <input type="checkbox" name="" id="includeLowerCase">
        <label for="">Uppercase</label>
        <input type="checkbox" name="" id="includeUpperCase">
        <label for="">Numbers</label>
        <input type="checkbox" name="" id="includeNumbers">
        <label for="">Special Characters</label>
        <input type="checkbox" name="" id="includeSpecialChars">
      </div>
    </section>
  </main>
  <footer>
    <div class="password-container__buttons">
        <button type="submit">Reset</button>
        <button id="generateBtn">Generate</button>
    </div>
    <p>Password: <span id="passwordResult"></span></p>
  </footer>
  <script src="scripts/index.js"></script>
</body>
</html>
