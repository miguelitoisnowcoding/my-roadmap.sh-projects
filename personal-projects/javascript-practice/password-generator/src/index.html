<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header>
    <h1>Password Generator</h1>
  </header>
  <main>
    <section class="password-container">
      <div class="password-container__length">
        <label for="">Password Length: </label>
        <input type="range" min="5" max="50" value="5" name="" id="passwordLengthRange">
        <p id="passwordLengthRange__value"></p>
      </div>
      <div class="password-container__radio">
        <p>What do you want to include?</p>
        <label for="includeLowerCase">Lowercase</label>
        <input type="checkbox" name="choices" id="includeLowerCase">
        <label for="includeUpperCase">Uppercase</label>
        <input type="checkbox" name="choices" id="includeUpperCase">
        <label for="includeNumbers">Numbers</label>
        <input type="checkbox" name="choices" id="includeNumbers">
        <label for="includeSpecialChars">Special Characters</label>
        <input type="checkbox" name="choices" id="includeSpecialChars">
      </div>
    </section>
  </main>
  <footer>
    <div class="password-container__buttons">
        <button type="submit">Reset</button>
        <button onclick="generatePassword()">Generate</button>
    </div>
    <p>Password: <span id="passwordResult"></span></p>
  </footer>
  <script src="script/index.js"></script>
</body>
</html>
