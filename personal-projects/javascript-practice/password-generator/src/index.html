<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="flex-center">
    <section class="password-container">
      <div class="password-header">
      <h1>Password Generator</h1>
      </div>
      <div class="password-container__length">
        <label for="passwordValue">Password Length: </label>
        <input type="number" min="1" max="100" name="passwordValue" id="passwordValue">
      </div>
      <div class="password-container__choices">
        <p>What do you want to include?</p>
        <div class="password-container__choices--checkbox">
          <label for="includeLowerCase">Lowercase</label>
          <input type="checkbox" name="choices" id="includeLowerCase">
          <label for="includeUpperCase">Uppercase</label>
          <input type="checkbox" name="choices" id="includeUpperCase">
          <label for="includeNumbers">Numbers</label>
          <input type="checkbox" name="choices" id="includeNumbers">
          <label for="includeSpecialChars">Special Characters</label>
          <input type="checkbox" name="choices" id="includeSpecialChars">
        </div>
      </div>

      <div class="password-container__buttons">
        <button id="generateBtn">Generate</button>
      </div>
      <div class="password-footer">
        <p>Password: <span id="passwordResult"></span></p>
      </div>
    </section>

    <section class="checker-container flex-center">
      <div class="checker-container__header">
        <h1>Password Evaluator</h1>
      </div>
      <div class="checker-container__body">
        <label for="passwordInput">Enter Your Password: </label>
        <input type="text" name="password" id="passwordInput">

        <div class="button-container flex-center">
          <button id="checkBtn">Check</button>
        </div>
      </div>
      <div class="checker-container__footer flex-center">
        <p>Password: <span id="output"></span></p>
        <ul>
          <li>[<span id="lengthStrength"><img src="../assets/x-icon.png" alt="x mark" width="10px"></span>] Minimum of 5 - 15 characters</li>
          <li>[<span id="upperCaseStrength"><img src="../assets/x-icon.png" alt="x mark" width="10px"></span>] Must contain an uppercase</li>
          <li>[<span id="lowerCaseStrength"><img src="../assets/x-icon.png" alt="x mark" width="10px"></span>] Must contain an lowercase</li>
          <li>[<span id="numberStrength"><img src="../assets/x-icon.png" alt="x mark" width="10px"></span>] Must contain a number</li>
          <li>[<span id="specialCharStrength"><img src="../assets/x-icon.png" alt="x mark" width="10px"></span>] Must contain a special character</li>
        </ul>
      </div>
    </section>

  </main>
  <script src="script/index.js"></script>
</body>
</html>
