<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock/Paper/Scissors Game</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <h1>Rock/Paper/Scissors Game</h1>
  </header>
  <main>

    <!--Main Player 1-->
    <section class="player-container">
      <h2 id="player-container__title">Player 1</h2>
      <div class="player-container__choices">
        <label for="">Rock</label>
        <input type="radio" name="choices" id="rockChoice">
        <label for="">Paper</label>
        <input type="radio" name="choices" id="paperChoice">
        <label for="">Scissors</label>
        <input type="radio" name="choices" id="scissorsChoice">
      </div>
      <div id="playerOneChoiceImages"></div>
      <div id="playerOneChoiceResult"></div>
    </section>
    
    <!--AUTOMATED PLAYER 2-->
    <section class="player-container" id="player-2">
      <h2 id="player-container__title">Player 2</h2>
      <div id="playerTwoChoiceImages"></div>
      <div id="playerTwoChoiceResult"></div>
    </section>
  </main>

  <footer>
    <p id="gameResult"></p>
    <button onclick="pressPlay()">Play</button>
  </footer>

  <script src="scripts/index.js"></script>
</body>
</html>
